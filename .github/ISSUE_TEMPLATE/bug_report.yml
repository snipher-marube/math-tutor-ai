name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the backend with `make backend`
        2. POST to /api/tutor/ask with ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python and Node versions, Ollama model name, device (laptop, Raspberry Pi, ...)
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
