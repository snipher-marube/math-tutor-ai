name: Curriculum / learning content
description: Report a wrong answer, an unsuitable explanation, or propose new Grade 2 content
labels: [curriculum]
body:
  - type: dropdown
    id: strand
    attributes:
      label: CBE strand
      options:
        - Numbers
        - Measurement
        - Geometry
        - Not sure
    validations:
      required: true
  - type: input
    id: substrand
    attributes:
      label: Sub-strand
      placeholder: e.g. Addition, Money, Time
  - type: textarea
    id: question
    attributes:
      label: Question asked
      description: The exact question the learner typed or was shown
  - type: textarea
    id: response
    attributes:
      label: Tutor response
      description: Paste what the tutor said (if reporting a problem)
  - type: textarea
    id: expected
    attributes:
      label: What a good answer looks like
      description: How would a Grade 2 teacher explain this? Cite the KICD curriculum design or learner's book if you can.
    validations:
      required: true
