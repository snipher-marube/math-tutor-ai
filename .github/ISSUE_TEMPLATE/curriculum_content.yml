name: Curriculum / learning content
description: Report a wrong answer or unsuitable explanation, or propose skills, common mistakes, or other Grades 1–3 content
labels: [curriculum]
body:
  - type: dropdown
    id: grade
    attributes:
      label: Grade
      options:
        - Grade 1
        - Grade 2
        - Grade 3
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of content is this?
      options:
        - Wrong or confusing tutor answer
        - New skill, or breaking a topic into skills
        - Common mistake children make (misconception)
        - Sample problems
        - Correction to docs/CURRICULUM.md
        - Other
    validations:
      required: true
  - type: dropdown
    id: strand
    attributes:
      label: CBE strand
      options:
        - Numbers
        - Measurement
        - Geometry
        - Not sure
    validations:
      required: true
  - type: input
    id: substrand
    attributes:
      label: Sub-strand
      placeholder: e.g. Addition, Money, Time
  - type: textarea
    id: question
    attributes:
      label: Question asked
      description: The exact question the learner typed or was shown
  - type: textarea
    id: response
    attributes:
      label: Tutor response
      description: Paste what the tutor said (if reporting a problem)
  - type: textarea
    id: expected
    attributes:
      label: What a good answer looks like
      description: How would a teacher explain this? For a common mistake, describe what the child does and how you help them. Cite the KICD curriculum design or learner's book if you can.
    validations:
      required: true
