name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is this for (learner, teacher, parent, contributor) and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: offline
    attributes:
      label: Offline check
      options:
        - label: This feature works without an internet connection, or degrades gracefully without one
